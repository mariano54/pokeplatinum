<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platinum Map Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l7 7-7 7-7-7z%22 fill=%22%235b9cff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
}
</script>
</head>
<body>
<header>
    <div class="brand">Platinum Map Editor</div>
    <div class="picker">
        <input id="map-search" list="map-list" placeholder="Search maps… (e.g. twinleaf)" autocomplete="off" spellcheck="false">
        <datalist id="map-list"></datalist>
    </div>
    <div class="map-title"><span id="map-name">—</span><span id="dirty" title="Unsaved changes">●</span></div>
    <div class="actions">
        <button id="undo" title="Undo (⌘Z)">↶</button>
        <button id="redo" title="Redo (⇧⌘Z)">↷</button>
        <button id="save" class="primary" title="Save (⌘S)">Save</button>
        <button id="build" title="Build the ROM">Build ROM</button>
        <span id="build-status"></span>
    </div>
</header>

<main>
    <nav id="tools">
        <button data-tool="select" title="Select & move props (V)"><b>V</b>Props</button>
        <button data-tool="collision" title="Paint collision (C)"><b>C</b>Collision</button>
        <button data-tool="behavior" title="Paint tile behaviors (B)"><b>B</b>Tiles</button>
        <button data-tool="area" title="Select a block of tiles and move everything in it (M)"><b>M</b>Move area</button>
        <button data-tool="events" title="Move warps, NPCs, signs and triggers (E)"><b>E</b>Events</button>
        <button data-tool="heights" title="Inspect and edit height plates (H)"><b>H</b>Heights</button>
        <hr>
        <div class="layers">
            <label><input type="checkbox" data-layer="terrain" checked>Terrain</label>
            <label><input type="checkbox" data-layer="props3d" checked>Props 3D</label>
            <label><input type="checkbox" data-layer="grid" checked>Grid</label>
            <label><input type="checkbox" data-layer="collision" checked>Collision</label>
            <label><input type="checkbox" data-layer="behaviors" checked>Tiles</label>
            <label><input type="checkbox" data-layer="propBoxes" checked>Prop boxes</label>
            <label><input type="checkbox" data-layer="events" checked>Events</label>
            <label><input type="checkbox" data-layer="heights">Heights</label>
        </div>
        <hr>
        <div class="views">
            <button data-view="top" class="active" title="Top-down editing view (1)">Top</button>
            <button data-view="3d" title="Orbit 3D preview (2)">3D</button>
        </div>
    </nav>

    <section id="viewport">
        <canvas id="gl"></canvas>
        <canvas id="overlay"></canvas>
        <div id="hover"></div>
        <div id="loading">Loading…</div>
    </section>

    <aside id="panel">
        <section id="context"></section>
        <section id="tool-options"></section>
        <section id="selection"></section>
        <section id="legend"></section>
    </aside>
</main>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
